name: Import from IMDb

on:
  issues:
    types: [opened]
  schedule:
    # IMDb refreshes its datasets around 00:45 UTC; retry waiting submissions after that.
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      imdb:
        description: IMDb links or IDs to import (any separator)
        required: true
      dry_run:
        description: Look up only, don't save
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: title-database
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'submission') ||
      startsWith(github.event.issue.title, '[Submission]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import titles
        env:
          GH_TOKEN: ${{ github.token }}
          IMDB_INPUT: ${{ inputs.imdb }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/import-imdb.mjs

      - name: Commit database changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add database
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import titles from IMDb (${{ github.event_name }})"
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || true

      - name: Reply on submissions
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reply.mjs
